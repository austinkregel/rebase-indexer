name: ci

# Build, lint, and test on every push / PR so regressions surface before a
# release tag. The release workflow handles per-platform binary publishing.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lance/datafusion pull in prost; ensure protoc is available.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Unit + integration tests (tree-sitter chunking, manifest diff, walk
      # filters, and a local on-disk LanceDB roundtrip — no network needed).
      - name: Test
        run: cargo test --all-targets
