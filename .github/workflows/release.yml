name: release

# Publish per-platform `rebase-indexer` binaries as release assets so the
# compute-agent can download the right one on demand. Triggered by pushing a
# version tag (e.g. `git tag v0.1.0 && git push --tags`), or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: macos-13,         target: x86_64-apple-darwin,       name: macos-x86_64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4

      # lance/datafusion pull in prost; ensure protoc is available on all runners.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/rebase-indexer" "rebase-indexer-${{ matrix.name }}"
        # raw binary, platform-suffixed, so the agent can fetch a predictable name

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/rebase-indexer.exe" "rebase-indexer-${{ matrix.name }}.exe"

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            rebase-indexer-${{ matrix.name }}
            rebase-indexer-${{ matrix.name }}.exe
          fail_on_unmatched_files: false
